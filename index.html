<style>
:root{--bg:#fbf3ea;--card:#fff9f2;--tx:#3d2433;--mu:#8a7080;--ac:#c8553d;--acD:#9c3b27;--rose:#f6d5d1;--sage2:#4f7a5a;--sageD:#36573f;--sun:#f0b84a;--sunD:#c48f1d;--ln:#ecd9cc;--lnD:#cdbba7;--sunT:#f0b84a33;--sageT:#4f7a5a22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231820;--card:#2e2029;--tx:#f7e9e1;--mu:#b39aa6;--ac:#ee8a6e;--acD:#b9573e;--rose:#4a2d3a;--sage2:#6fae7c;--sageD:#497a54;--ln:#43303c;--lnD:#2a1c25}}
:root[data-theme="dark"]{--bg:#231820;--card:#2e2029;--tx:#f7e9e1;--mu:#b39aa6;--ac:#ee8a6e;--acD:#b9573e;--rose:#4a2d3a;--sage2:#6fae7c;--sageD:#497a54;--ln:#43303c;--lnD:#2a1c25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 'DM Sans',system-ui,sans-serif;padding-bottom:92px}
main{max-width:520px;margin:0 auto;padding:0 16px 20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 2px;border-bottom:2px solid var(--ln);margin-bottom:14px}
.top .st{display:flex;align-items:center;gap:4px;font:800 18px 'DM Sans';margin-right:auto}
.top .st svg{width:28px;height:28px}
.top .xp{font:800 16px 'DM Sans';background:var(--sunT);color:var(--sunD);border-radius:14px;padding:5px 11px}
.top .lv{font:800 13px 'DM Sans';background:var(--ln);border-radius:14px;padding:6px 10px}
.top button{background:none;border:0;font-size:18px;cursor:pointer;padding:2px 4px;color:var(--mu)}
.week{display:flex;justify-content:space-between;background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:10px 12px;margin-bottom:14px}
.week div{text-align:center;font:800 11px 'DM Sans';color:var(--mu)}
.week i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin-top:4px;background:var(--ln);font-style:normal;font-size:16px;color:#fff}
.week .on i{background:var(--sun);color:#3d2433}
.week .td i{outline:3px solid var(--ac);outline-offset:1px}
.say{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:10px 14px;margin-bottom:6px}
.say svg{width:58px;flex:none}
.say p{margin:0;font-weight:500;font-size:15px}
select{display:block;width:100%;font:16px 'DM Sans',sans-serif;padding:14px;border:2px solid var(--ln);border-radius:16px;background:var(--card);color:var(--tx);margin-bottom:10px}
.row{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;padding:0 4px}
.plank{height:12px;background:#b58559;border-radius:3px;box-shadow:0 4px 0 #8a6340;margin-bottom:6px}
.bk{position:relative;width:27px;border-radius:5px 5px 2px 2px;border:2px solid var(--lnD);background:var(--ln);cursor:pointer;overflow:hidden;flex:none}
.bk:before,.bk:after{content:"";position:absolute;left:2px;right:2px;height:2px;background:#ffffff80;z-index:1}
.bk:before{top:6px}.bk:after{bottom:6px}
.bk i{position:absolute;left:0;right:0;bottom:0;background:var(--c);opacity:.85}
.bk.r{background:var(--c);border-color:#0003}
.bk span{position:absolute;left:50%;top:15px;transform:translateX(-50%);writing-mode:vertical-rl;font:700 10.5px 'DM Sans',sans-serif;color:var(--mu);white-space:nowrap;z-index:2}
.bk.r span{color:#fff}.bk.p span{color:var(--tx)}
.bk.o{outline:3px solid var(--tx);outline-offset:1px}
.lg{display:flex;gap:14px;font:700 12px 'DM Sans';color:var(--mu);margin-bottom:6px}
.lg span{display:flex;align-items:center;gap:5px}.lg i{width:12px;height:16px;border-radius:3px;border:2px solid var(--lnD);background:var(--ln)}
.lg i.lr{background:var(--ac);border-color:#0003}.lg i.lp{background:linear-gradient(0deg,var(--ac) 50%,var(--ln) 50%)}
.tt{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;margin-top:8px}.tt button{flex:none;border:2px solid var(--ln);background:var(--card);border-radius:16px;padding:8px 14px;text-align:left;cursor:pointer;color:var(--mu);max-width:210px}.tt button.on{border-color:var(--sun);background:var(--sunT)}.tt b{display:block;font:800 14px "DM Sans";color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt small{font:700 11px "DM Sans"}.tt .nt{border-style:dashed;align-self:center}.tt .nt b{color:var(--ac)}
.yr{display:flex;gap:8px;margin:10px 0 4px}.yr button{flex:1;border:2px solid var(--ln);background:var(--card);border-radius:16px;padding:9px 12px;text-align:left;cursor:pointer;color:var(--mu)}.yr button.on{border-color:var(--sun);background:var(--sunT)}.yr b{display:block;font:800 18px "DM Sans";color:var(--tx)}.yr small{font:700 11px "DM Sans"}
.node.lk{opacity:.55}
.plan{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:12px 14px;margin:8px 0 4px;font-size:14px}.plan p{margin:8px 0 0;color:var(--mu);font-weight:500}
.name{background:var(--sunT);border-radius:20px;padding:14px;margin-bottom:12px}
.sec{font:800 12px 'DM Sans';letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:22px 0 -8px;text-align:center}

.unit b{font:600 22px Fraunces,Georgia,serif;display:block;line-height:1.15}
.unit small{opacity:.92;font-weight:700;font-size:13px}
.unit span{font:800 22px 'DM Sans'}
.nw{display:flex;justify-content:center;margin-bottom:16px;position:relative}
.node{width:68px;height:68px;border-radius:50%;border:0;font:800 21px Fraunces,Georgia,serif;background:var(--ln);color:var(--mu);box-shadow:0 6px 0 var(--lnD);cursor:pointer}
.node:active{transform:translateY(5px);box-shadow:0 1px 0 var(--lnD)}
.node.d{background:var(--sun);color:#3d2433;box-shadow:0 6px 0 var(--sunD)}
.node.c{background:var(--ac);color:#fff;box-shadow:0 6px 0 var(--acD);animation:pls 1.6s infinite}
@keyframes pls{50%{transform:scale(1.07)}}
.go{position:absolute;top:-36px;background:var(--card);border:2px solid var(--ln);border-radius:12px;padding:3px 10px;font:800 13px 'DM Sans';color:var(--ac);animation:bob .9s infinite alternate}
.go:after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--card);border-right:2px solid var(--ln);border-bottom:2px solid var(--ln);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{to{transform:translateY(-5px)}}
.btn{display:block;width:100%;font:800 15px 'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:15px;border:0;border-radius:16px;background:var(--ac);color:#fff;box-shadow:0 5px 0 var(--acD);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--acD)}
.btn.g{background:var(--sage2);box-shadow:0 5px 0 var(--sageD)}
.btn.g:active{box-shadow:0 1px 0 var(--sageD)}
.btn.gh{background:none;color:var(--mu);box-shadow:none;border:2px solid var(--ln)}
.btn.gh:active{transform:none;background:var(--ln)}
h2.pg{font:600 30px Fraunces,Georgia,serif;margin:8px 0 12px}
.card{background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px}
.q{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.q:last-child{margin:0}
.q i{width:44px;height:44px;border-radius:50%;background:var(--ln);display:grid;place-items:center;font-style:normal;font-size:20px;flex:none}
.q.ok i{background:var(--sage2);color:#fff}
.q div{flex:1}
.q b{display:block;font-size:15px}
.pbar{height:12px;background:var(--ln);border-radius:8px;overflow:hidden;margin-top:6px}

.q.ok .pbar i{background:var(--sage2)}
.mk{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card);border:2px solid var(--ln);margin-bottom:10px;opacity:.5}

.mk.on i{background:var(--sun);color:#3d2433}
.mk b{font:600 18px Fraunces,Georgia,serif;display:block}
.mk small{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:2px solid var(--ln);border-radius:16px;padding:9px 2px;font:800 12px 'DM Sans',sans-serif;background:none;color:var(--mu);cursor:pointer}
.tabs button.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.item{border-radius:18px;padding:14px;margin-bottom:10px;display:flex;gap:6px;background:var(--card);border:2px solid var(--ln)}
.item.words{border-left:8px solid var(--sage2)}.item.verses{border-left:8px solid var(--ac)}.item.chars{border-left:8px solid var(--sun)}.item.apps{border-left:8px solid #7a4a6a}

.item b{font:600 19px Fraunces,Georgia,serif}
.item small{display:block;margin-top:6px;font-size:12px;color:var(--mu);font-weight:700}
.tag{display:inline-block;background:#7a4a6a;color:#fff;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:800;margin-bottom:4px}
.x{background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer;align-self:flex-start;padding:0 4px}
.empty{color:var(--mu);font:italic 400 17px Fraunces,Georgia,serif;text-align:center;padding:26px 10px}
input,textarea{display:block;width:100%;font:16px 'DM Sans',sans-serif;padding:14px 16px;border:2px solid var(--ln);border-radius:16px;background:var(--card);color:var(--tx);margin-bottom:10px;outline:0}
input:focus,textarea:focus{border-color:var(--sage2)}
textarea{min-height:96px;resize:none}
::placeholder{color:var(--mu)}
.areas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.areas button{border:2px solid var(--ln);background:none;border-radius:16px;padding:7px 13px;font:700 13px 'DM Sans',sans-serif;color:var(--mu);cursor:pointer}
.areas button.on{background:var(--sage2);border-color:var(--sage2);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ln);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
nav button{flex:1;background:none;border:2px solid transparent;border-radius:16px;padding:6px 0 4px;font:800 11px 'DM Sans',sans-serif;color:var(--mu);cursor:pointer}
nav button.on{background:var(--sunT);border-color:var(--sun);color:var(--sunD)}
nav svg{display:block;margin:0 auto 2px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(14px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.ovtop{display:flex;gap:12px;align-items:center}
.ovtop button{background:none;border:0;font-size:26px;color:var(--mu);cursor:pointer;padding:0}
.pb{flex:1;height:16px;background:var(--ln);border-radius:10px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--sage2);border-radius:10px;transition:width .4s}
.ovbody{flex:1;overflow:auto;padding:22px 0}
.ovbody h2{font:600 28px/1.15 Fraunces,Georgia,serif;margin:8px 0 6px}
.ovbody .ref{font:600 40px/1.1 Fraunces,Georgia,serif;color:var(--ac);margin:18px 0}
.ovbody .sub{color:var(--mu);margin:0 0 16px}
.ovbody .mas{width:96px}
.ovft{display:flex;flex-direction:column;gap:10px}
.fin{text-align:center}
.fin .mas{width:140px;animation:hop .7s}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.08,.92) rotate(2.5deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{30%{transform:translateY(-24px)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}}
.stats{display:flex;gap:10px;margin:18px 0}
.stats div{flex:1;border:2px solid var(--ln);border-radius:16px;padding:10px 4px;background:var(--card)}
.stats b{display:block;font:800 24px 'DM Sans'}
.stats small{font:800 11px 'DM Sans';color:var(--mu);text-transform:uppercase}
.stats div:first-child{border-color:var(--sun);background:var(--sunT)}
.flash{border:2px solid var(--ln);background:var(--card);border-radius:22px;padding:22px 18px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.flash .t{font:600 26px/1.25 Fraunces,Georgia,serif}
.flash .a{padding-top:10px;border-top:2px dashed var(--ln);font:italic 400 19px/1.4 Fraunces,Georgia,serif}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:700;font-size:14px;z-index:95;animation:tout .4s 2s forwards;width:max-content;max-width:88vw;text-align:center}
@keyframes tout{to{opacity:0}}
.sp{position:fixed;width:14px;height:14px;z-index:90;pointer-events:none;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:rise 1.3s ease-out forwards}
@keyframes rise{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.3);opacity:0}}
</style>

if(s<5){h+=`<div class="ovbody">${mascot(s===0?"read":"happy")}<h2>${STEPS[s][0]}</h2><p class="sub">${STEPS[s][1]}</p>`;
if(s===0)h+=`<div class="ref">${esc(c.ref)}</div>${L.was?`<p class="sub">Você já leu este capítulo. <a href="#" onclick="undoRead();return false" style="color:var(--ac)">Desmarcar leitura</a></p>`:""}`;
if(s===1)h+=`<input id="a1" placeholder="Palavra"><input id="a2" placeholder="O que significa?">`;

h+=`</div><div class="ovft"><button class="btn ${s===0?"":"g"}" onclick="lnext()">${s===0?(L.was?"Continuar":"Já li!"):"Continuar"}</button>${s>0?`<button class="btn gh" onclick="lnext(1)">Pular</button>`:""}</div></div>`}
else{const st=streak();h+=`<div class="ovbody fin">${mascot(L.fin?"star":"cheer")}<h2>${L.fin||"Lição concluída!"}</h2><p class="sub">${L.fin?"Mais uma conquista para a sua trilha.":"Mais um dia de leitura. Que orgulho!"}</p><div class="stats"><div><b>+${L.xp}</b><small>XP</small></div><div><b>${st}</b><small>dias seguidos</small></div><div><b>${L.saved}</b><small>anotações</small></div></div></div><div class="ovft"><button class="btn g" onclick="closeOv()">Continuar</button></div></div>`;
setTimeout(()=>{if(!L.fx){L.fx=1;sparks(innerWidth/2,innerHeight/3,40)}},50)}

h+=`<div class="ovbody"><h2>Você lembra?</h2><p class="sub">${{words:"Palavra",verses:"Versículo",chars:"Personagem",apps:"Aplicação"}[k]} de ${esc(x.ref)}</p><div class="flash"><div class="t">${q}</div>${P.show?`<div class="a">${esc(a||"(sem anotação)")}</div>`:""}</div></div><div class="ovft">${P.show?`<button class="btn g" onclick="pans(1)">Lembrei</button><button class="btn gh" onclick="pans(0)">Preciso rever</button>`:`<button class="btn" onclick="P.show=1;drawOv()">Mostrar resposta</button>`}</div></div>`}
else h+=`<div class="ovbody fin">${mascot(P.ok>=3?"cheer":"happy")}<h2>Prática concluída!</h2><p class="sub">Revisar é o que faz o conteúdo ficar.</p><div class="stats"><div><b>+${P.xp}</b><small>XP</small></div><div><b>${P.ok}/${P.c.length}</b><small>lembrei</small></div></div></div><div class="ovft"><button class="btn g" onclick="closeOv()">Continuar</button></div></div>`;
ov.innerHTML=h;return}
ov.innerHTML=""}
/* ---------- Prática ---------- */
function startP(){const a=[];["words","verses","chars","apps"].forEach(k=>S[k].forEach(x=>a.push({k,x})));if(!a.length){toast("Anote algo em uma lição primeiro");return}
a.sort(()=>Math.random()-.5);P={c:a.slice(0,5),i:0,show:0,ok:0,xp:0,fx:0};drawOv()}
function pans(ok){if(ok){P.ok++;P.xp+=5;S.xp+=5;sound()}P.i++;P.show=0;if(P.i===P.c.length){P.xp+=10;S.xp+=10;S.prac[today()]=(S.prac[today()]||0)+P.c.length;save();sound(true);setTimeout(()=>sparks(innerWidth/2,innerHeight/3,36),50)}drawOv()}
/* ---------- Telas ---------- */
function marks(){const s=streak(),d=dn(),f=(a,z)=>{for(let b=a;b<=z;b++)if(!bfull(b))return false;return true};
return[["✦","Primeiro passo","Seu primeiro capítulo no app",Object.values(S.done).some(v=>v!=="pre")],["◆","Semana de constância","7 dias seguidos",s>=7],["▲","Rotina de ferro","30 dias seguidos, como no treino",s>=30],["✎","Dez palavras novas","Vocabulário crescendo",S.words.length>=10],["❝","Dez versículos guardados","Seu caderno de versículos",S.verses.length>=10],["♡","Dez personagens","Cada um com sua história",S.chars.length>=10],["⚑","Líder da própria vida","10 aplicações anotadas",S.apps.length>=10],["◐","Cem capítulos","100 capítulos lidos no app",Object.values(S.done).filter(v=>v!=="pre").length>=100],["✝","Pentateuco concluído","De Gênesis a Deuteronômio",f(0,4)],["❖","Históricos concluídos","De Josué a Ester",f(5,16)],["✧","Profetas menores concluídos","De Oseias a Malaquias",f(27,38)],["★","Trilha concluída","Complete uma trilha inteira",S.trails.some(t=>trIdx(t).length>0&&trDone(t)===trIdx(t).length)]]}
const OFF=[0,34,52,34,0,-34,-52,-34];
const IC={est:'<rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="7" width="4" height="13" rx="1"/><path d="M15 20l3.5-13 3 .8L18 21z"/>',trilha:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',prac:'<path d="M4 12a8 8 0 0 1 14-5l2-2v6h-6l2.2-2.2A5 5 0 1 0 17 12"/>',metas:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',dia:'<path d="M6 3h11a2 2 0 0 1 2 2v16H8a2 2 0 0 1-2-2zM6 19a2 2 0 0 1 2-2h11"/>'};
function render(){
if(openU===null)openU={};
const rt=readToday()>0;let h=`<div class="top"><div class="st">${flame(rt)}<span style="color:${rt?"#e0742c":"var(--mu)"}">${streak()}</span></div><span class="xp">⭐ ${S.xp} XP</span><span class="lv">Nv ${level()}</span><button onclick="mute()">${S.mute?"🔇":"🔊"}</button></div>`;
if(tab==="trilha"){
h+=`<div class="week">${week()}</div><div class="say">${mascot(readToday()?"star":streak()?"worried":"happy")}<p onclick="setName()">${say()}</p></div>`;
if(!S.name)h+=`<div class="name"><div style="font-weight:700;margin-bottom:8px">Como posso te chamar?</div><input id="nm" placeholder="Seu nome"><button class="btn g" onclick="saveName()">Salvar</button></div>`;

}
}
else if(tab==="est")h+=estante();

}

h+=`<h2 class="pg">Metas do dia</h2><div class="card">${q.map(x=>{const p=Math.min(1,x[2]/x[3]);return`<div class="q ${p>=1?"ok":""}"><i>${p>=1?"✓":x[0]}</i><div><b>${x[1]}</b><div class="pbar"><i style="width:${p*100}%"></i></div></div><small style="font-weight:800;color:var(--mu)">${Math.min(x[2],x[3])}/${x[3]}</small></div>`}).join("")}</div>${backupCard()}${priorCard()}<h2 class="pg" style="margin-top:22px">Conquistas</h2>${m.map(x=>`<div class="mk ${x[3]?"on":""}"><i>${x[0]}</i><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join("")}`;
}
else{

const a=S[dt];h+=a.length?a.map((x,i)=>`<div class="item ${dt}"><div>${dt==="apps"?`<span class="tag">${esc(x.area||"")}</span><div>${esc(x.t)}</div>`:dt==="verses"?`<q>${esc(x.t)}</q>`:`<b>${esc(x.t)}</b>`}${dt!=="apps"&&x.m?`<div>${esc(x.m)}</div>`:""}<small>${esc(x.ref)}</small></div><button class="x" onclick="del('${dt}',${i})">×</button></div>`).join(""):`<p class="empty">Ainda vazio. Faça uma lição e suas anotações aparecem aqui.</p>`;

document.getElementById("nav").innerHTML=[["trilha","Trilha"],["est","Estante"],["prac","Praticar"],["metas","Metas"],["dia","Diário"]].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="T('${t[0]}')"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join("");
