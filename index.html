<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha Bíblica</title>
<meta name="theme-color" content="#0c0e1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trilha">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap">
<style>
:root{--bg:#f2efe9;--card:#ffffff;--tx:#15151a;--mu:#76726b;--ac:#d4a24c;--acD:#a87a2e;--sage2:#5f8f74;--sageD:#3f6b53;--sun:#d4a24c;--sunD:#a87a2e;--ln:#e4dfd5;--lnD:#cfc8ba;--sunT:#d4a24c26;--sageT:#5f8f7426;--btn:#15151a;--btnT:#f4efe6;--fd:'Bricolage Grotesque',system-ui,sans-serif;--fn:'Orbitron','Bricolage Grotesque',sans-serif;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d10;--card:#17171c;--tx:#f1ece3;--mu:#9a958b;--ln:#26262d;--lnD:#383840;--btn:#f1ece3;--btnT:#0d0d10}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 'DM Sans',system-ui,sans-serif;padding-bottom:104px}
main{max-width:520px;margin:0 auto;padding:0 16px 24px}
.cap{font:600 11px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font:700 16px var(--fd);line-height:1.1}
.av{width:40px;height:40px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;font:700 17px var(--fd)}
.chips{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:20px;border:1px solid var(--lnD);font:700 13px 'DM Sans'}
.chip.hot{border-color:var(--ac);color:var(--ac)}
.hcard{padding:14px 0 6px}
.hcard h1{font:700 38px/1.06 var(--fd);letter-spacing:-.035em;margin:8px 0 0}
.hcard h1 span{color:var(--mu)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 12px}
.tile{position:relative;border-radius:24px;padding:18px;color:#f4efe6;overflow:hidden}
.tile.wide{grid-column:1/-1}
.tile .cap{color:#f4efe699;display:block}
.tile h3{font:700 36px/1.05 var(--fd);letter-spacing:-.03em;margin:8px 0 2px}
.tile .sm{font-size:14px;opacity:.7;font-weight:500}
.num{font:800 44px/1 var(--fn);letter-spacing:-.02em;margin-top:10px}
.num small{font:600 14px 'DM Sans';letter-spacing:0;opacity:.6}
.bars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:14px}
.bars i{flex:1;background:var(--ac);border-radius:3px;min-height:5px}
.bars i.z{background:#ffffff26}
.asc i{background:#ffffff26}.asc i.on{background:var(--ac)}
.hero{background:#1d3b31}
.hero .shp{position:absolute;pointer-events:none}
.hero .s1{right:0;top:0;width:60%;height:100%;background:#2b5545;clip-path:polygon(42% 0,100% 0,100% 100%,0 100%)}
.hero .s2{right:0;bottom:0;width:34%;height:38%;background:#c9743f;clip-path:polygon(100% 0,100% 100%,0 100%)}
.hero>*:not(.shp){position:relative;z-index:1}
.hero .hnum{position:absolute;right:18px;top:14px;font:800 96px/1 var(--fn);letter-spacing:-.04em;color:#f4efe6}
.hero h3{margin-top:44px;font-size:38px}
.tl{display:flex;align-items:center;gap:10px;margin-top:18px;font:700 11px var(--fn)}
.dl{flex:1;position:relative;border-top:2px dotted #f4efe699;height:0}
.dl i{position:absolute;top:-8px;width:14px;height:14px;border-radius:50%;background:var(--ac);transform:translateX(-50%);box-shadow:0 0 0 5px #d4a24c40}
.pbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:18px;background:#f4efe6;color:#15151a;border:0;border-radius:40px;padding:6px 6px 6px 22px;font:700 16px var(--fd);cursor:pointer}
.pbtn .arr{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#15151a;display:grid;place-items:center;font-size:20px}
.pbtn:active{transform:scale(.98)}
.tk{background:#181b2b}
.tkh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.tkh b{font:700 22px var(--fd)}
.tkh .ring{position:relative;width:48px;height:48px;flex:none}
.tkh .ring svg{transform:rotate(-90deg)}
.tkh .ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 11px var(--fn)}
.ti{display:flex;gap:12px;align-items:center;background:#ffffff12;border-radius:14px;padding:12px 14px;margin-top:8px;font-weight:600;font-size:15px}
.ti i{width:24px;height:24px;border-radius:50%;border:2px solid #ffffff55;display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.ti.ok{opacity:.5;text-decoration:line-through}
.ti.ok i{background:var(--ac);border-color:var(--ac);color:#15151a}
.calc{background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px}
.calh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.calh b{font:700 20px var(--fd);text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal em{font:600 11px 'DM Sans';color:var(--mu);text-align:center;font-style:normal;padding-bottom:2px}
.dc{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font:600 13px 'DM Sans';color:var(--mu)}
.dc.on{background:rgba(212,162,76,var(--a,1));color:#15151a;font-weight:800}
.dc.ms{background:var(--ln)}
.dc.ft{border:1px dashed var(--lnD);opacity:.5}
.dc.td{border:2px solid var(--tx);color:var(--tx);font-weight:800}
.btn{display:block;width:100%;font:700 16px var(--fd);padding:15px;border:0;border-radius:40px;background:var(--btn);color:var(--btnT);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.g{background:var(--btn);color:var(--btnT)}
.btn.gh{background:none;color:var(--tx);border:1px solid var(--lnD)}
.btn.gold{background:var(--ac);color:#15151a}
.btn.s{margin-top:10px}
.st{font:700 28px var(--fd);letter-spacing:-.02em;margin:22px 0 2px}
.card,.plan{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.plan{margin:6px 0 12px;font-size:14px}
.plan p{margin:8px 0 6px;color:var(--mu);font-weight:500}
.pbar{height:6px;background:var(--ln);border-radius:6px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .5s}
.tt{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-top:8px}
.tt button{flex:none;border:1px solid var(--lnD);background:none;border-radius:30px;padding:8px 16px;text-align:left;cursor:pointer;color:var(--tx);max-width:220px}
.tt button.on{background:var(--btn);border-color:var(--btn);color:var(--btnT)}
.tt b{display:block;font:700 14px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt button.on small{color:var(--btnT);opacity:.7}
.tt small{font:600 11px 'DM Sans';color:var(--mu)}
.tt .nt{border-style:dashed;align-self:center}.tt .nt b{color:var(--ac)}
.road{background:#151826;border-radius:26px;padding:18px 10px 20px;margin:12px 0;color:#f4efe6}
.road .rh{display:flex;justify-content:space-between;align-items:center;padding:0 8px 6px}
.road .rh b{font:700 20px var(--fd)}
.road .rh span{font:600 12px 'DM Sans';opacity:.6}
.map{position:relative;width:100%}
.mp{position:absolute;inset:0;width:100%;height:100%}
.pt0{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:1 11;stroke-linecap:round;opacity:.3}
.pt2{fill:none;stroke-width:14;stroke-linecap:round;opacity:.2}
.pt1{fill:none;stroke-width:5;stroke-linecap:round}
.stop{position:absolute;transform:translate(-50%,-50%);text-align:center;width:132px}
.nd{position:relative;display:grid;place-items:center;width:78px;height:78px;border-radius:50%;border:0;background:var(--c,var(--ac));box-shadow:0 0 0 6px #ffffff12;cursor:pointer;margin:0 auto;padding:0}
.nd:active{transform:scale(.95)}
.nd .ic{width:32px;height:32px;fill:none;stroke:#15151a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nd .rg{position:absolute;left:-10px;top:-10px;width:calc(100% + 20px);height:calc(100% + 20px);transform:rotate(-90deg);pointer-events:none}
.nd.full:after{content:"✓";position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:#5f8f74;border:2.5px solid #151826;color:#fff;font:800 14px/21px sans-serif}
.nd.lk{opacity:.45}
.nd.fin{background:#f4efe6;cursor:default}
.nl{margin-top:12px}
.nl b{display:block;font:700 15px/1.15 var(--fd);color:#f4efe6}
.nl small{font:600 12px 'DM Sans';opacity:.6}
.tag{position:absolute;left:50%;top:-44px;transform:translateX(-50%);background:var(--ac);color:#15151a;border-radius:10px;padding:4px 11px;font:700 11px 'DM Sans';white-space:nowrap;animation:bob .9s ease-in-out infinite alternate}
.tag:after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--ac);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{to{transform:translateX(-50%) translateY(-6px)}}
.sbg{position:fixed;inset:0;background:#0d0d10b3;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;width:100%;max-width:520px;max-height:82%;overflow:auto;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:46px;height:5px;border-radius:3px;background:var(--lnD);margin:0 auto 14px}
.sheet h2{font:700 36px/1.05 var(--fd);letter-spacing:-.03em;margin:4px 0 6px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:9px}
.ct{aspect-ratio:1;border-radius:14px;border:1px solid var(--lnD);background:none;font:700 19px var(--fd);color:var(--tx);cursor:pointer}
.ct.d{background:var(--sage2);border-color:var(--sage2);color:#fff}
.ct.c{background:var(--ac);border-color:var(--ac);color:#15151a}
.ct.lk{opacity:.4}
h2.pg{font:700 36px/1.05 var(--fd);letter-spacing:-.03em;margin:22px 0 14px}
.center{text-align:center}
.st3{display:flex;margin:18px 0;border-radius:20px;background:var(--card);overflow:hidden}
.st3 div{flex:1;text-align:center;padding:14px 4px}
.st3 div+div{border-left:1px solid var(--ln)}
.st3 b{display:block;font:800 26px/1.1 var(--fn)}
.st3 small{font:600 11px 'DM Sans';color:var(--mu)}
.q{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.q:last-child{border:0}
.q i{width:26px;height:26px;border-radius:50%;border:2px solid var(--lnD);display:grid;place-items:center;font-style:normal;font-size:13px;color:#15151a;flex:none}
.q.ok i{background:var(--ac);border-color:var(--ac)}
.q>div{flex:1}.q b{font-weight:700;font-size:15px}
.q small{color:var(--mu);font-weight:700}
.mb{height:6px;background:var(--ln);border-radius:6px;margin-top:6px;overflow:hidden}
.mb u{display:block;height:100%;border-radius:6px}
.mds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.md{text-align:center;padding:14px 6px;border-radius:20px;background:var(--card);opacity:.45}
.md.on{opacity:1;border:1px solid var(--ac)}
.md span{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 8px;border-radius:50%;background:var(--ln);font:700 21px var(--fd);color:var(--mu)}
.md.on span{background:var(--ac);color:#15151a}
.md b{display:block;font:700 15px/1.1 var(--fd)}
.md small{font-size:11px;display:block;margin-top:3px;color:var(--mu)}
.tabs{display:flex;gap:2px;margin-bottom:14px;background:var(--card);border-radius:40px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:30px;padding:9px 2px;font:700 12.5px 'DM Sans';color:var(--mu);cursor:pointer}
.tabs button.on{background:var(--btn);color:var(--btnT)}
.item{border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;gap:6px;background:var(--card);border-left:4px solid var(--ac)}
.item.words{border-color:var(--sage2)}.item.verses{border-color:#c9743f}.item.chars{border-color:var(--ac)}.item.apps{border-color:#7e6bb0}
.item>div{flex:1}
.item q{font:600 19px/1.35 var(--fd);quotes:"“" "”"}
.item b{font:700 21px var(--fd)}
.item small{display:block;margin-top:6px;font:600 11px 'DM Sans';letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.tag2{display:inline-block;background:var(--tx);color:var(--bg);border-radius:8px;padding:1px 9px;font-size:12px;font-weight:700;margin-bottom:4px}
.x{background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer;align-self:flex-start;padding:0 4px}
.empty{color:var(--mu);font:600 18px var(--fd);text-align:center;padding:26px 10px}
input,textarea,select{display:block;width:100%;font:16px 'DM Sans',sans-serif;padding:14px 16px;border:1px solid var(--lnD);border-radius:16px;background:var(--card);color:var(--tx);margin-bottom:10px;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
textarea{min-height:96px;resize:none}
::placeholder{color:var(--mu)}
.areas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.areas button{border:1px solid var(--lnD);background:none;border-radius:30px;padding:9px 15px;font:600 14px 'DM Sans',sans-serif;color:var(--tx);cursor:pointer}
.areas button.on{background:var(--btn);border-color:var(--btn);color:var(--btnT)}
.name{background:var(--sunT);border-radius:20px;padding:14px;margin:12px 0}
.sec{font:700 11px 'DM Sans';letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:22px 0 -8px;text-align:center}
.row{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;padding:0 4px}
.plank{height:8px;background:var(--lnD);border-radius:3px;margin-bottom:6px}
.bk{position:relative;width:27px;border-radius:5px 5px 2px 2px;background:var(--ln);cursor:pointer;overflow:hidden;flex:none}
.bk:before,.bk:after{content:"";position:absolute;left:3px;right:3px;height:2px;background:#ffffff80;z-index:1}
.bk:before{top:6px}.bk:after{bottom:6px}
.bk i{position:absolute;left:0;right:0;bottom:0;background:var(--c)}
.bk.r{background:var(--c)}
.bk span{position:absolute;left:50%;top:15px;transform:translateX(-50%);writing-mode:vertical-rl;font:700 10.5px 'DM Sans',sans-serif;color:var(--mu);white-space:nowrap;z-index:2}
.bk.r span,.bk.p span{color:#15151a}
.bk.o{outline:2px solid var(--tx);outline-offset:1px}
.lg{display:flex;gap:14px;font:600 12px 'DM Sans';color:var(--mu);margin-bottom:6px}
.lg span{display:flex;align-items:center;gap:5px}.lg i{width:12px;height:16px;border-radius:3px;background:var(--ln)}
.lg i.lr{background:var(--ac)}.lg i.lp{background:linear-gradient(0deg,var(--ac) 50%,var(--ln) 50%)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92%,440px);background:#17171c;border:1px solid #2c2c34;border-radius:40px;display:flex;gap:2px;padding:6px;z-index:30;box-shadow:0 14px 34px #00000055}
nav button{flex:1;background:none;border:0;border-radius:30px;padding:7px 0 5px;font:600 10px 'DM Sans',sans-serif;color:#8d8880;cursor:pointer}
nav button.on{background:var(--ac);color:#15151a}
nav svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.ovtop{display:flex;gap:14px;align-items:center}
.ib{background:var(--card);border:0;color:var(--tx);cursor:pointer;width:40px;height:40px;border-radius:50%;font-size:24px;line-height:1;display:grid;place-items:center;flex:none}
.pb{flex:1;height:6px;background:var(--ln);border-radius:6px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .4s}
.ovbody{flex:1;overflow:auto;padding:24px 0}
.ovbody h2{font:700 38px/1.05 var(--fd);letter-spacing:-.03em;margin:8px 0 8px}
.sub{color:var(--mu);margin:0 0 18px;font-size:15px;font-weight:500}
.bigref{display:flex;align-items:center;gap:18px;margin:24px 0}
.bn{font:800 96px/1 var(--fn);letter-spacing:-.05em;color:var(--ac)}
.bt{font:700 30px/1.05 var(--fd);letter-spacing:-.02em}
.ovft{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.fin{text-align:center}
.done{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.flash{background:var(--card);border:1px solid var(--lnD);border-radius:24px;padding:24px 20px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.flash .t{font:700 28px/1.15 var(--fd);letter-spacing:-.02em}
.flash .a{padding-top:12px;border-top:1px dashed var(--lnD);font:600 20px/1.35 var(--fd);color:var(--ac)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:700;font-size:14px;z-index:95;animation:tout .4s 2s forwards;width:max-content;max-width:88vw;text-align:center}
@keyframes tout{to{opacity:0}}
.sp{position:fixed;width:12px;height:12px;z-index:90;pointer-events:none;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:rise 1.3s ease-out forwards}
@keyframes rise{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.3);opacity:0}}
a{color:var(--ac);font-weight:700}

.vit{background:radial-gradient(circle at 50% 46%,#2f64b866 0,transparent 60%),radial-gradient(circle at 12% 88%,#8a45b855 0,transparent 48%),radial-gradient(circle at 92% 10%,#c0392b44 0,transparent 45%),#0c0e1c;padding-bottom:20px}
.vit .vt{display:flex;justify-content:space-between;align-items:flex-start}
.vit .vp{font:800 38px/1 var(--fn);letter-spacing:-.03em;color:#f4efe6}
.vit h3{font-size:28px;margin:6px 0 2px}
.vit svg{display:block;margin:10px auto 0;width:min(100%,300px);height:auto;overflow:visible}
.vit .rays{transform-origin:center;transform-box:fill-box;animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vit .gl{animation:sh 5s ease-in-out infinite}
@keyframes sh{50%{fill-opacity:.72}}
.vit .nw{animation:nw 1.6s ease-in-out infinite}
@keyframes nw{50%{fill-opacity:.55;stroke:#fff}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="ov"></div>
<script>

return[["✦","Primeiro passo","Seu primeiro capítulo no app",Object.values(S.done).some(v=>v!=="pre")],["◆","Semana de constância","7 dias seguidos",s>=7],["▲","Rotina de ferro","30 dias seguidos, como no treino",s>=30],["✎","Dez palavras novas","Vocabulário crescendo",S.words.length>=10],["❝","Dez versículos guardados","Seu caderno de versículos",S.verses.length>=10],["♡","Dez personagens","Cada um com sua história",S.chars.length>=10],["⚑","Líder da própria vida","10 aplicações anotadas",S.apps.length>=10],["◐","Cem capítulos","100 capítulos lidos no app",Object.values(S.done).filter(v=>v!=="pre").length>=100],["✝","Pentateuco concluído","De Gênesis a Deuteronômio",f(0,4)],["❖","Históricos concluídos","De Josué a Ester",f(5,16)],["✧","Profetas menores concluídos","De Oseias a Malaquias",f(27,38)],["★","Trilha concluída","Complete uma trilha inteira",S.trails.some(t=>trIdx(t).length>0&&trDone(t)===trIdx(t).length)]]}
const IC={trilha:'<circle cx="12" cy="14" r="4"/><path d="M12 4v3M4.5 8.5l2 2M19.5 8.5l-2 2M3 19h18"/>',est:'<rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="7" width="4" height="13" rx="1"/><path d="M15 20l3.5-13 3 .8L18 21z"/>',prac:'<path d="M4 12a8 8 0 0 1 14-5l2-2v6h-6l2.2-2.2A5 5 0 1 0 17 12"/>',metas:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',dia:'<path d="M6 3h11a2 2 0 0 1 2 2v16H8a2 2 0 0 1-2-2zM6 19a2 2 0 0 1 2-2h11"/>'};
function render(){
if(openU===null)openU={};
const rt=readToday()>0;
let h=`<header class="hd"><div class="who"><div class="av">${esc((S.name||"T").slice(0,1).toUpperCase())}</div><div><span class="cap">Bem-vinda de volta</span><b>${S.name?esc(S.name):"Trilha Bíblica"}</b></div></div><div class="chips"><span class="chip ${rt?"hot":""}">${SUN}${streak()}</span><span class="chip">${S.xp} XP</span></div></header>`;
if(tab==="trilha"){
const hr=new Date().getHours(),g=hr<12?"Bom dia":hr<18?"Boa tarde":"Boa noite";
const dd0=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
h+=`<div class="hcard"><span class="cap">${dd0}</span><h1 onclick="setName()">${g}${S.name?", "+esc(S.name):""}. <span>${rt?"Leitura de hoje concluída.":"Sua leitura de hoje."}</span></h1></div>`;
if(!S.name)h+=`<div class="name"><div style="font-weight:700;margin-bottom:8px">Como posso te chamar?</div><input id="nm" placeholder="Seu nome"><button class="btn g" onclick="saveName()">Salvar</button></div>`;
const tr=curTr();if(tr)S.cur=tr.id;
const ia=tr?trIdx(tr):[],lockd=tr?new Date()<stDate(tr):false,c0=ia.find(i=>!S.done[i]);
if(tr)h+=bento(tr,ia,c0,lockd);
h+=calendar();
h+=trailTabs(tr);
if(!tr)h+=`<div class="card center" style="margin-top:10px"><div><span style="color:var(--ac)">${MARK(64)}</span></div><h2 class="pg" style="margin-top:8px">Monte a sua trilha</h2><p style="color:var(--mu);margin:0 0 16px;font-weight:500">Escolha o que quer estudar (um livro, um grupo ou vários) e o ritmo de leitura. O app cria o caminho para você.</p><button class="btn" onclick="newTrail()">Criar minha primeira trilha</button></div>`;
else{h+=planCard(tr);h+=`<div class="road"><div class="rh"><b>Mapa da trilha</b><span>Toque em um ponto</span></div>${mapHTML(tr,c0,lockd)}</div>`}
}
else if(tab==="est")h+=estante();
else if(tab==="prac"){
const n=S.words.length+S.verses.length+S.chars.length+S.apps.length;
h+=`<h2 class="pg">Praticar</h2><div class="card center"><div style="color:var(--sun)"><span style="color:var(--ac)">${MARK(56)}</span></div><p style="margin:10px 0 16px;color:var(--mu)">${n?"Revise 5 anotações sorteadas e ganhe XP. Revisar é o que faz tudo ficar na memória.":"Quando você anotar algo nas leituras, poderá praticar aqui."}</p><button class="btn g" onclick="startP()">Começar prática</button></div><div class="st3"><div><b>${S.words.length}</b><small>palavras</small></div><div><b>${S.verses.length}</b><small>versículos</small></div><div><b>${S.chars.length}</b><small>pessoas</small></div><div><b>${S.apps.length}</b><small>aplicar</small></div></div>`;
}
else if(tab==="metas"){
const q=[["Ler 1 capítulo",readToday(),1],["Fazer 2 anotações",notesToday(),2],["Praticar 5 cartões",S.prac[today()]||0,5]],m=marks();
h+=`<h2 class="pg">Metas do dia</h2><div class="card">${q.map(x=>{const p=Math.min(1,x[1]/x[2]);return`<div class="q ${p>=1?"ok":""}"><i>${p>=1?"✓":""}</i><div><b>${x[0]}</b><div class="mb"><u style="width:${p*100}%;background:var(--sun)"></u></div></div><small>${Math.min(x[1],x[2])}/${x[2]}</small></div>`}).join("")}</div><div class="card"><button class="btn gh" onclick="mute()" style="background:var(--bg)">Som: ${S.mute?"desligado":"ligado"}</button></div>${backupCard()}${priorCard()}<h2 class="pg">Conquistas</h2><div class="mds">${m.map(x=>`<div class="md ${x[3]?"on":""}"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join("")}</div>`;
}
else{
const KN={words:"Palavras",verses:"Versículos",chars:"Pessoas",apps:"Aplicar"};
h+=`<h2 class="pg">Meu diário</h2><div class="tabs">${Object.keys(KN).map(k=>`<button class="${dt===k?"on":""}" onclick="dt='${k}';render()">${KN[k]} ${S[k].length}</button>`).join("")}</div>`;
const a=S[dt];h+=a.length?a.map((x,i)=>`<div class="item ${dt}"><div>${dt==="apps"?`<span class="tag2">${esc(x.area||"")}</span><div>${esc(x.t)}</div>`:dt==="verses"?`<q>${esc(x.t)}</q>`:`<b>${esc(x.t)}</b>`}${dt!=="apps"&&x.m?`<div>${esc(x.m)}</div>`:""}<small>${esc(x.ref)}</small></div><button class="x" onclick="del('${dt}',${i})">×</button></div>`).join(""):`<p class="empty">Ainda vazio. Faça uma leitura e suas anotações aparecem aqui.</p>`;
}
document.getElementById("app").innerHTML=h;
document.getElementById("nav").innerHTML=[["trilha","Hoje"],["est","Estante"],["prac","Praticar"],["metas","Metas"],["dia","Diário"]].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="T('${t[0]}')"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join("");
}
render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
